<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VolcEngine 屏幕共享最小复现</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 16px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: #1a1a2e;
        color: #eee;
      }
      h1 {
        font-size: 18px;
        margin: 0 0 8px;
      }
      .meta {
        font-size: 12px;
        color: #aaa;
        margin-bottom: 16px;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 12px;
        align-items: center;
      }
      label {
        font-size: 13px;
      }
      input[type='text'] {
        width: 280px;
        padding: 6px 8px;
        border: 1px solid #444;
        border-radius: 4px;
        background: #16213e;
        color: #eee;
      }
      button {
        padding: 8px 14px;
        border: none;
        border-radius: 4px;
        background: #0f3460;
        color: #fff;
        cursor: pointer;
        font-size: 13px;
      }
      button:hover {
        background: #1a508b;
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      button.danger {
        background: #c0392b;
      }
      .video-wrap {
        display: flex;
        gap: 16px;
        margin: 16px 0;
      }
      .video-panel {
        flex: 1;
        min-width: 280px;
      }
      .video-panel h3 {
        font-size: 14px;
        margin: 0 0 8px;
      }
      #local-video-container,
      #screen-video-container {
        width: 100%;
        height: 240px;
        background: #000;
        border: 1px solid #333;
        border-radius: 4px;
        overflow: hidden;
      }
      #log {
        height: 220px;
        overflow-y: auto;
        padding: 8px;
        background: #0d1117;
        border: 1px solid #333;
        border-radius: 4px;
        font-family: ui-monospace, monospace;
        font-size: 12px;
        white-space: pre-wrap;
        word-break: break-all;
      }
      .hint {
        font-size: 12px;
        color: #f39c12;
        margin-bottom: 12px;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <h1>VolcEngine vertc-electron-sdk 屏幕共享最小复现</h1>
    <div class="meta" id="runtime-info">加载运行时信息…</div>

    <div class="hint">
      复现目标：同一 SDK 版本下，Electron 13.6.9 正常；Electron 28/31 停止屏幕共享后
      macOS 顶部「屏幕录制中」指示可能不消失，本地摄像头回显可能黑屏。
      开始共享时会模拟业务行为（主窗最小化），停止共享时还原主窗并尝试恢复摄像头。
    </div>

    <div class="row">
      <label for="app-id">AppId：</label>
      <input id="app-id" type="text" placeholder="火山 RTC AppId（必填）" />
    </div>

    <div class="row">
      <button id="btn-init">1. 初始化 SDK</button>
      <button id="btn-camera">2. 开启摄像头回显</button>
      <button id="btn-share">3. 开始屏幕共享</button>
      <button id="btn-stop" class="danger" disabled>4. 停止共享并恢复摄像头</button>
      <button id="btn-clear-log">清空日志</button>
    </div>

    <div class="video-wrap">
      <div class="video-panel">
        <h3>本地摄像头（#local-video-container）</h3>
        <div id="local-video-container"></div>
      </div>
      <div class="video-panel">
        <h3>屏幕共享预览（#screen-video-container）</h3>
        <div id="screen-video-container"></div>
      </div>
    </div>

    <h3>调用日志（返回值 0 表示 SDK 成功）</h3>
    <div id="log"></div>

    <script src="src/renderer.js"></script>
  </body>
</html>
